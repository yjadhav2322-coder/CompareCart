<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Account - CompareCart</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        Compare<span class="logo-highlight">Cart</span>
    </div>


    <div class="nav-links">

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('all_products') }}">
            Products
        </a>

    </div>


    <div class="nav-actions">

        <a href="{{ url_for('logout') }}"
           class="account-button">

            <span class="account-icon">
                🚪
            </span>

            <span>
                Logout
            </span>

        </a>

    </div>

</nav>


<!-- ACCOUNT PAGE -->

<section class="account-section">

    <div class="account-card">

        <div class="account-icon-large">
            👤
        </div>


        <span class="small-title">
            MY ACCOUNT
        </span>


        <h1>
            Welcome, {{ user.name }}
        </h1>


        <p class="account-email">
            {{ user.email }}
        </p>


        <div class="account-options">

            <a href="#" class="account-option">

                <span>
                    ❤️
                </span>

                <div>
                    <strong>
                        My Wishlist
                    </strong>

                    <small>
                        Products you saved
                    </small>
                </div>

            </a>


            <a href="#" class="account-option">

                <span>
                    🛒
                </span>

                <div>
                    <strong>
                        My Cart
                    </strong>

                    <small>
                        Products in your cart
                    </small>
                </div>

            </a>


            <a href="{{ url_for('logout') }}"
               class="account-option">

                <span>
                    🚪
                </span>

                <div>
                    <strong>
                        Logout
                    </strong>

                    <small>
                        Sign out of your account
                    </small>
                </div>

            </a>

        </div>

    </div>

</section>


</body>

</html>
