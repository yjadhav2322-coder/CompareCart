<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - CompareCart</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        Compare<span class="logo-highlight">Cart</span>
    </div>

    <div class="nav-links">

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('all_products') }}">
            Products
        </a>

    </div>

</nav>


<!-- REGISTER -->

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-header">

            <span class="small-title">
                JOIN COMPARECART
            </span>

            <h1>Create Your Account</h1>

            <p>
                Create an account to save products and manage your cart.
            </p>

        </div>


        {% if error %}

        <div class="auth-error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST"
              action="{{ url_for('register') }}">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button type="submit"
                    class="auth-button">

                Create Account

            </button>

        </form>


        <div class="auth-footer">

            <p>
                Already have an account?
                <a href="{{ url_for('login') }}">
                    Login
                </a>
            </p>

        </div>

    </div>

</section>


</body>

</html>
